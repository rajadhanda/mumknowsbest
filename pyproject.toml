[project]
name = "mumknowsbest"
version = "0.1.0"
description = "A conversational assistant for Mum's recipes (paper book, Instagram, YouTube)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # messages.parse(output_format=...) with block-level parsed_output requires a
    # modern SDK — floor verified empirically against 0.117.
    "anthropic>=0.117",
    "pydantic>=2",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
mumknowsbest = "mumknowsbest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mumknowsbest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
