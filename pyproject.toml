[project]
name = "mumknowsbest"
version = "0.1.0"
description = "A conversational assistant for Mum's recipes (paper book, Instagram, YouTube)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Use the latest SDK — vision + messages.parse (structured outputs) are relied on.
    "anthropic>=0.40",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mumknowsbest = "mumknowsbest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mumknowsbest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
